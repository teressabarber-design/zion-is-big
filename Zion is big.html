<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zion is Big</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Poppins', sans-serif; overflow-x: hidden; }

    .glitch {
      animation: glitch 0.3s infinite;
    }

    @keyframes glitch {
      0% { transform: translate(0px); }
      25% { transform: translate(2px, -2px); }
      50% { transform: translate(-2px, 2px); }
      75% { transform: translate(2px, 2px); }
      100% { transform: translate(0px); }
    }
  </style>
</head>
<body class="bg-black text-white">

<!-- NAV -->
<header class="p-4 text-center text-3xl font-bold text-cyan-400 glitch">
  Zion is Big
</header>

<!-- CHAOS GAME -->
<section class="h-screen flex flex-col justify-center items-center text-center">
  <h1 class="text-5xl mb-4 glitch">CHAOS CLICKER 🍔</h1>
  <p class="text-gray-400 mb-6">Click anything. Things will happen. Probably.</p>

  <div onclick="chaosClick()" class="text-8xl cursor-pointer select-none">
    🧍‍♂️
  </div>

  <p id="score" class="mt-6 text-xl">Score: 0</p>
</section>

<!-- RANDOM CHAOS AREA -->
<div id="chaos" class="fixed inset-0 pointer-events-none"></div>

<!-- FAKE REVIEWS -->
<section class="py-20 text-center">
  <h2 class="text-3xl mb-6">Totally Real Reviews</h2>
  <p>⭐ "This site broke my brain"</p>
  <p>⭐ "I clicked once and now I can't stop"</p>
  <p>⭐ "Why are there burgers everywhere"</p>
</section>

<!-- FOOTER -->
<footer class="text-center p-6 text-gray-500">
  This website makes no sense 👍
</footer>

<script>
let score = 0;

function chaosClick() {
  score++;
  document.getElementById('score').innerText = 'Score: ' + score;

  // Spawn random emoji
  const emojis = ['🍔','💀','🔥','👾','😂','⚡'];
  const el = document.createElement('div');
  el.innerText = emojis[Math.floor(Math.random() * emojis.length)];
  el.className = 'absolute text-4xl';

  el.style.left = Math.random() * window.innerWidth + 'px';
  el.style.top = window.innerHeight - 50 + 'px';

  document.getElementById('chaos').appendChild(el);

  let pos = window.innerHeight - 50;
  const float = setInterval(() => {
    pos -= 3;
    el.style.top = pos + 'px';

    if (pos < 0) {
      clearInterval(float);
      el.remove();
    }
  }, 16);

  // Random screen shake
  if (Math.random() < 0.3) {
    document.body.classList.add('glitch');
    setTimeout(() => document.body.classList.remove('glitch'), 200);
  }
}
</script>

</body>
</html>
